
<div  class="box-card" >
    <div></div>
    <div class="round-color" [ngStyle]="{'--initial-background':background}"></div>
    <div class="box-content">
        <div class="box-image">
            <img src={{image}} alt={{alt}} class="image modern">
        </div>
        
    <div class="box-title">
        {{title}}
    </div>
    <div class="box-button">
        <button class="read-more-btn" (click)="onButtonClick()">{{button_text}}</button>
    </div>
</div>
</div>
